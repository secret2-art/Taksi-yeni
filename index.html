        body { background-color: #121212; color: #fff; padding: 12px; display: flex; justify-content: center; }
        .container { max-width: 500px; width: 100%; background: #1e1e1e; border-radius: 14px; padding: 18px; border: 1px solid #333; position: relative; }
        
        /* Language Dropdown */
        .menu-container { position: absolute; top: 12px; right: 12px; z-index: 999; }
        .menu-btn { background: #262626; border: 1px solid #444; color: #fff; padding: 6px 12px; font-size: 11px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .dropdown-content { display: none; position: absolute; right: 0; top: 34px; background: #262626; min-width: 140px; box-shadow: 0px 8px 16px rgba(0,0,0,0.8); z-index: 1000; border-radius: 6px; border: 1px solid #444; overflow: hidden; }
        .dropdown-content button { color: #fff; padding: 10px; text-align: left; background: none; border: none; width: 100%; cursor: pointer; font-size: 12px; border-bottom: 1px solid #333; }
        .dropdown-content button:hover { background: #f2a900; color: #121212; }
        .show { display: block; }

        .header { text-align: center; margin-bottom: 15px; margin-top: 25px; }
        .header h1 { color: #f2a900; font-size: 20px; margin-bottom: 4px; padding: 0 10px; }
        .header p { font-size: 12px; color: #aaa; }

        /* Form UI */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
        .card { background: #262626; border: 2px solid #333; border-radius: 8px; padding: 10px; text-align: center; cursor: pointer; }
        .card.active { border-color: #f2a900; background: #2d2612; }
        .card img { width: 100%; height: 55px; object-fit: contain; margin-bottom: 4px; border-radius: 4px; background: #fff; padding: 2px; }
        .card b { display: block; font-size: 13px; margin-bottom: 2px; }
        .card span { font-size: 11px; color: #aaa; }

        .form-group { margin-bottom: 10px; }
        label { font-size: 11px; color: #aaa; display: block; margin-bottom: 4px; }
        input, select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #444; background: #121212; color: #fff; font-size: 13px; }
        input[type="datetime-local"] { color-scheme: dark; }

        .price-box { background: #2d2612; border: 1px solid #f2a900; padding: 12px; text-align: center; margin-top: 12px; border-radius: 6px; }
        .price-title { font-size: 11px; color: #aaa; margin-bottom: 3px; }
        .price-amount { font-size: 24px; color: #f2a900; font-weight: bold; }

        .btn { background: #25D366; color: #fff; border: none; width: 100%; padding: 13px; border-radius: 25px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 12px; }
        .btn-secondary { background: transparent; color: #aaa; border: 1px solid #444; width: 100%; padding: 9px; border-radius: 20px; font-size: 11px; cursor: pointer; margin-top: 6px; }
        .note { font-size: 10px; color: #888; text-align: center; margin-top: 6px; }

        /* Divider & Guide Section */
        .divider { margin: 25px 0 15px 0; border-bottom: 1px solid #333; text-align: center; position: relative; }
        .divider span { background: #1e1e1e; padding: 0 10px; position: relative; top: -10px; font-size: 12px; color: #f2a900; font-weight: bold; letter-spacing: 0.5px; }

        .guide-section { margin-top: 15px; }
        .week-title { background: #262626; border-left: 3px solid #f2a900; padding: 10px; border-radius: 4px; font-size: 13px; font-weight: bold; color: #fff; margin-top: 15px; margin-bottom: 10px; }
        .category-title { font-size: 12px; color: #f2a900; font-weight: bold; margin: 10px 0 6px 0; }
        
        .place-card { background: #161616; border: 1px solid #2a2a2a; border-radius: 6px; padding: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .place-info { font-size: 12px; color: #ddd; width: 70%; }
        .place-info b { display: block; color: #fff; font-size: 13px; margin-bottom: 2px; }
        .place-info span { font-size: 11px; color: #888; }

        </div>
    </div>

            <option value="AP_TO_HOTEL" id="optDir1">Havalimanı ➔ Otel (Karşılama Dahil +200₺)</option>
        </select>
    </div>

    <!-- Airport -->
    <div class="form-group">
        <label id="lblAp">Havalimanı *:</label>
        <select id="selAp" onchange="calc()">
            <option value="IST">Istanbul Airport (IST)</option>
            <option value="SAW">Sabiha Gokcen (SAW)</option>
        </select>
    </div>

    <!-- Hotel Info -->
    <div class="form-group">
        <label id="lblHotel">Otel Adı *:</label>
        <input type="text" id="txtHotel" placeholder="Örn: Karaköy Port Hotel">
    </div>

    <div class="grid">
        <div class="form-group">
            <label id="lblRoom">Oda No *:</label>
            <input type="text" id="txtRoom" placeholder="Örn: 204">
        </div>
        <div class="form-group">
            <label id="lblPax">Kişi Sayısı *:</label>
            <select id="selPax"></select>
        </div>
    </div>

    <!-- Guest Name -->
    <div class="form-group">
        <label id="lblName">Misafir Adı Soyadı *:</label>
        <input type="text" id="txtName" placeholder="Örn: John Doe">
    </div>

    <!-- Flight Code -->
    <div class="form-group">
        <label id="lblFlight">Uçuş Kodu (Örn: TK1982) *:</label>
        <input type="text" id="txtFlight" placeholder="Uçuş kodunuzu giriniz">
    </div>

    <!-- Payment -->
    <div class="form-group">
        <label id="lblPay">Ödeme Şekli *:</label>
        <select id="selPay" onchange="calc()">
            <option value="CASH" id="optCash">Araçta Nakit Ödeme</option>
            <option value="CARD" id="optCard">Araçta Kredi Kartı (+%10 Komisyon)</option>
        </select>
    </div>

    <!-- Date & Time -->
    <div class="form-group">
        <label id="lblTime">Transfer Tarihi & Saati *:</label>
        <input type="datetime-local" id="txtTime">
    </div>

    <!-- Price -->
    <div class="price-box">

    </div>

    <button class="btn-secondary" id="btnAsk" onclick="askQuestion()">💬 Sadece Soru Sormak / Canlı Destek</button>

    </div>

</div>

                            { title: "Buyukada & St. George Church", sub: "Princes Islands", query: "Buyukada Aya Yorgi" }
                        ]
                    }
                ]
            }
        ]
    };

    const basePrices = { TAXI: { IST: 1600, SAW: 1800 }, VITO: { IST: 2000, SAW: 2200 } };

    function changeLang(lang) {
        currentLang = lang;
        const t = translations[lang] || translations['EN'];
        document.getElementById('lblTitle').innerText = t.title;
        document.getElementById('lblSub').innerText = t.sub;
        document.getElementById('lblTaxiName').innerText = t.taxiName;
        document.getElementById('lblTaxiCap').innerText = t.taxiCap;
        document.getElementById('lblVitoName').innerText = t.vitoName;
        document.getElementById('lblVitoCap').innerText = t.vitoCap;
        document.getElementById('lblDir').innerText = t.dir;
        document.getElementById('optDir1').innerText = t.optDir1;
        document.getElementById('optDir2').innerText = t.optDir2;
        document.getElementById('lblAp').innerText = t.ap;
        document.getElementById('lblHotel').innerText = t.hotel;
        document.getElementById('lblRoom').innerText = t.room;
        document.getElementById('lblPax').innerText = t.pax;
        document.getElementById('lblName').innerText = t.name;
        document.getElementById('lblFlight').innerText = t.flight;
        document.getElementById('lblPay').innerText = t.pay;
        document.getElementById('optCash').innerText = t.optCash;
        document.getElementById('optCard').innerText = t.optCard;
        document.getElementById('lblTime').innerText = t.time;
        document.getElementById('lblPriceTitle').innerText = t.priceTitle;
        document.getElementById('btnSend').innerText = t.btnSend;
        document.getElementById('btnAsk').innerText = t.btnAsk;
        document.getElementById('lblNote').innerText = t.note;
        document.getElementById('lblGuideHeader').innerText = t.guideHeader;

        updatePaxOptions();
        renderGuide();
        
        var dropdowns = document.getElementsByClassName("dropdown-content");
        for (var i = 0; i < dropdowns.length; i++) dropdowns[i].classList.remove('show');
    }

    function renderGuide() {
        const container = document.getElementById('guideContainer');
        const data = guideData[currentLang] || guideData['EN'];
        const mapText = translations[currentLang]?.mapBtn || '📍 Map';
        
        let html = '';
        data.forEach(w => {
            html += `<div class="week-title">${w.week}</div>`;
            w.cats.forEach(c => {
                html += `<div class="category-title">${c.name}</div>`;
                c.items.forEach(item => {
                    const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.query)}`;
                    html += `
                        <div class="place-card">
                            <div class="place-info">
                                <b>${item.title}</b>
                                <span>${item.sub}</span>
                            </div>
                            <a href="${mapUrl}" target="_blank" class="map-btn">${mapText}</a>
                        </div>
                    `;
                });
            });
        });
        container.innerHTML = html;
    }

    function updatePaxOptions() {
        const paxSelect = document.getElementById('selPax');
        const currentVal = paxSelect.value;
        paxSelect.innerHTML = '';
        const maxPax = vehicle === 'TAXI' ? 4 : 7;
        const paxLabel = translations[currentLang].paxText;
        for (let i = 1; i <= maxPax; i++) {
            const opt = document.createElement('option');
            opt.value = i;
            opt.textContent = i + " " + paxLabel;
            paxSelect.appendChild(opt);
        }
        if(currentVal <= maxPax && currentVal > 0) paxSelect.value = currentVal;
    }

    function setV(type) {
        vehicle = type;
        document.getElementById('cTaxi').classList.toggle('active', type === 'TAXI');
        document.getElementById('cVito').classList.toggle('active', type === 'VITO');
        updatePaxOptions();
        calc();
    }

    function calc() {
        const ap = document.getElementById('selAp').value;
        const dir = document.getElementById('selDir').value;
        let total = basePrices[vehicle][ap];
        if (dir === 'AP_TO_HOTEL') total += 200;
        if (document.getElementById('selPay').value === 'CARD') total *= 1.10;
        document.getElementById('txtPrice').innerText = Math.round(total) + " ₺";
    }

    function send() {
        const t = translations[currentLang];
        const dir = document.getElementById('selDir').value;
        const ap = document.getElementById('selAp').value === 'IST' ? 'Istanbul Airport (IST)' : 'Sabiha Gokcen (SAW)';
        const hotel = document.getElementById('txtHotel').value.trim();
        const room = document.getElementById('txtRoom').value.trim();
        const pax = document.getElementById('selPax').value;
        const name = document.getElementById('txtName').value.trim();
        const flight = document.getElementById('txtFlight').value.trim();
        
        const isCard = document.getElementById('selPay').value === 'CARD';
        const payStr = isCard ? (currentLang==='TR'?"Araçta kart":"Credit Card in Car") : (currentLang==='TR'?"Araçta Nakit":"Cash in Car");
        const payEmoji = isCard ? "💳" : "💸";
        
        const time = document.getElementById('txtTime').value;
        const price = document.getElementById('txtPrice').innerText;

        if(!hotel || !room || !name || !time || !flight) { 
            alert(currentLang==='TR' ? "Lütfen Otel Adı, Oda No, Misafir Adı, Uçuş Kodu ve Tarih/Saat alanlarını eksiksiz doldurun." : "Please fill in Hotel Name, Room No, Guest Name, Flight Code and Date/Time fields."); 
            return; 
        }

        const dirText = dir === 'AP_TO_HOTEL' ? (currentLang==='TR'?'Havalimanı ➔ Otel (Karşılama Dahil)':'Airport ➔ Hotel (Meet & Greet)') : (currentLang==='TR'?'Otel ➔ Havalimanı':'Hotel ➔ Airport');
        const vEmoji = vehicle === 'TAXI' ? '🚖' : '🚙';
        const vName = vehicle === 'TAXI' ? (currentLang==='TR'?'Sarı taksi':'Yellow taxi') : 'Vito VIP';

        const msg = `🚨 *YENİ TRANSFER REZERVASYONU*\n\n` +
                    `${vEmoji} *${t.msgCar || 'Araç'}:* ${vName}\n` +
                    `🗺️ *${t.msgDir || 'Yön'}:* ${dirText}\n` +
                    `✈️ *${t.msgAp || 'Havalimanı'}:* ${ap}\n` +
                    `🏨 *${t.msgHotel || 'Otel'}:* ${hotel} (Room: ${room})\n` +
                    `👤 *${t.msgGuest || 'Misafir'}:* ${name} (${pax} ${t.paxText})\n` +
                    `🎫 *${t.msgFlight || 'Uçuş Kodu'}:* ${flight}\n` +
                    `📅 *${t.msgTime || 'Tarih/Saat'}:*\n${time.replace('T', ' ')}\n` +
                    `${payEmoji} *${t.msgPay || 'Ödeme'}:* ${payStr}\n` +
                    `💰 *${t.msgTotal || 'Tutar'}:* ${price}\n\n` +
                    `_Müşteri tarafından web üzerinden gönderilmiştir._`;

        window.open(`https://wa.me/905521679703?text=${encodeURIComponent(msg)}`, '_blank');
    }

    function askQuestion() {
        window.open(`https://wa.me/905521679703?text=${encodeURIComponent('Merhaba, İstanbul transferi veya gezilecek yerler hakkında bilgi almak istiyorum.')}`, '_blank');
    }

    window.onload = function() {
        const n = new Date();
        n.setMinutes(n.getMinutes() - n.getTimezoneOffset());
        document.getElementById('txtTime').value = n.toISOString().slice(0, 16);
        changeLang('TR');
        calc();
    }
</script>
</body>
</html>
